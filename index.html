<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Store</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        .app-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .app-card:active { transform: scale(0.98); }
        .app-icon {
            width: 80px;
            height: 80px;
            background-color: #007aff; /* Placeholder color */
            border-radius: 18px;
            margin: 0 auto 10px;
        }
        .app-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .get-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>My App Store</h1>

    <div class="app-grid">
        <div class="app-card">
            <div class="app-icon" style="background: orange;"></div>
            <div class="app-title">Cool Game</div>
            <a href="#" class="get-btn">GET</a>
        </div>

        <div class="app-card">
            <div class="app-icon" style="background: purple;"></div>
            <div class="app-title">Utility App</div>
            <a href="#" class="get-btn">GET</a>
        </div>
        
        <div class="app-card">
            <div class="app-icon" style="background: green;"></div>
            <div class="app-title">Chat Tool</div>
            <a href="#" class="get-btn">GET</a>
        </div>
    </div>

    <script>
        // Simple Service Worker Registration to allow PWA install
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
